{{ define "main" }}
<div
  class="container mx-auto p-4 flex flex-col gap-4 min-h-[calc(100vh-8rem)]"
  data-pagefind-ignore
>
  <div class="p-6 rounded-lg">
    <h1 class="text-3xl font-bold mb-6">{{ .Title }}</h1>
    <p class="mb-6">
      All our content, organized by the
      <a
        href="/lessons/find-a-data-job/#four-competencies-of-a-data-professional"
        class="text-blue-600 dark:text-blue-400 hover:underline"
        >Four Competencies of a Data Professional</a
      >.
    </p>
    {{ range .Data.Terms.Alphabetical }}
    <div class="mb-8">
      <h2 class="text-2xl font-semibold mb-4 text-gray-800 dark:text-gray-200">
        {{ .Page.Title }}
        <span class="text-sm font-normal text-gray-600 dark:text-gray-400"
          >({{ .Count }} lessons)</span
        >
      </h2>
      <div class="grid gap-4 pl-4">
        {{ range .Pages.ByTitle }}
        {{ partial "content-card.html" . }}
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
